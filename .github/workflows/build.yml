name: build

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.sh
      - .github/workflows/build.yml
      - Dockerfile

# Publish Release assets without pushing commits into protected main.
permissions:
  contents: write

concurrency:
  group: caddy-release-publish-${{ github.ref }}-v3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check upstream release and published assets
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)"
          if [[ ! "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream stable release: $latest" >&2
            exit 1
          fi
          release_tag="caddy-$latest"
          assets_ready='false'
          if asset_names="$(gh release view "$release_tag" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            if grep -Fxq caddy_amd64 <<<"$asset_names" &&
               grep -Fxq caddy_arm64 <<<"$asset_names" &&
               grep -Fxq SHA256SUMS <<<"$asset_names"; then
              assets_ready='true'
            fi
          fi
          needs_build='false'
          if [[ "$FORCE_BUILD" == 'true' || "$assets_ready" != 'true' ]]; then
            needs_build='true'
          fi
          echo "Upstream: $latest; complete Release: $assets_ready; rebuild: $needs_build"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: steps.upstream.outputs.needs_build == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Cache Go dependencies
        if: steps.upstream.outputs.needs_build == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('build.sh') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build amd64 and arm64
        if: steps.upstream.outputs.needs_build == 'true'
        env:
          CADDY_VERSION: ${{ steps.upstream.outputs.version }}
        run: bash build.sh
      - name: Set up Docker Buildx
        if: steps.upstream.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: steps.upstream.outputs.needs_build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform image
        if: steps.upstream.outputs.needs_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            shell20021020/caddynaive:latest
            shell20021020/caddynaive:${{ steps.upstream.outputs.version }}
      - name: Publish versioned GitHub Release binaries
        if: steps.upstream.outputs.needs_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
          CADDY_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum caddy_amd64 caddy_arm64 > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" caddy_amd64 caddy_arm64 SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" caddy_amd64 caddy_arm64 SHA256SUMS \
              --target "$GITHUB_SHA" --title "Caddy $CADDY_VERSION (custom modules)" \
              --notes "Caddy $CADDY_VERSION with caddy-l4, Cloudflare DNS and AliDNS. NaiveProxy is not included." \
              --latest
          fi
