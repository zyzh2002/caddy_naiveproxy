name: build

on:
  # Poll upstream releases without rebuilding when the published version is current.
  # Use an off-hour minute to avoid GitHub's peak schedule load.
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.sh
      - .github/workflows/build.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: caddy-build-${{ github.ref }}-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Use the ephemeral GITHUB_TOKEN for both checkout and git push.
          persist-credentials: true
      - name: Detect latest upstream Caddy release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          # A config push or manual run should always rebuild.
          FORCE_BUILD: ${{ github.event_name != 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api repos/caddyserver/caddy/releases/latest --jq '.tag_name')"
          if [[ ! "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream release tag: $latest" >&2
            exit 1
          fi

          current='unknown'
          has_layer4='false'
          if [[ -x caddy_amd64 ]]; then
            if detected="$(./caddy_amd64 version | awk '{print $1}')"; then
              current="$detected"
            fi
            if ./caddy_amd64 list-modules | grep -Fxq 'layer4'; then
              has_layer4='true'
            fi
          fi

          needs_build='false'
          if [[ "$FORCE_BUILD" == 'true' || "$latest" != "$current" || "$has_layer4" != 'true' ]]; then
            needs_build='true'
          fi

          echo "Upstream release: $latest; published binary: $current; layer4: $has_layer4; build: $needs_build"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: steps.upstream.outputs.needs_build == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Cache Go dependencies
        if: steps.upstream.outputs.needs_build == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('build.sh') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build and verify
        if: steps.upstream.outputs.needs_build == 'true'
        env:
          CADDY_VERSION: ${{ steps.upstream.outputs.version }}
        run: bash build.sh
      - name: Commit and push updated binaries
        if: steps.upstream.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add caddy_amd64 caddy_arm64
          if git diff --cached --quiet; then
            echo 'No binary changes to commit'
          else
            git commit -m "build: update Caddy to ${{ steps.upstream.outputs.version }}"
            # GITHUB_TOKEN pushes do not trigger downstream push workflows.
            git push origin HEAD:main
            # workflow_dispatch *does* trigger even when using GITHUB_TOKEN.
            gh workflow run docker.yml --ref main
          fi
