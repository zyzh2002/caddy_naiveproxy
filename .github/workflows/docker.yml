name: docker

# Manual republish from an existing Release; never use stale main branch binaries.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag caddy-vX.Y.Z (empty selects latest)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: caddy-docker-manual
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Dockerfile
        uses: actions/checkout@v7
      - name: Download release binaries
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_INPUT"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^caddy-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Caddy Release tag: $tag" >&2
            exit 1
          fi
          gh release download "$tag" --pattern caddy_amd64 --pattern caddy_arm64 --clobber
          chmod +x caddy_amd64 caddy_arm64
          ./caddy_amd64 list-modules | grep -Fxq layer4
          echo "version=${tag#caddy-}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            shell20021020/caddynaive:latest
            shell20021020/caddynaive:${{ steps.release.outputs.version }}
